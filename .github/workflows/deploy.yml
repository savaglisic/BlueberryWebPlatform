name: Deploy Cloudflare production

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      apply_migrations:
        description: Apply pending remote D1 migrations
        required: true
        default: true
        type: boolean

concurrency:
  group: cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Validate and deploy Cloudflare Workers
    runs-on: [self-hosted, Linux, X64]
    permissions:
      contents: read
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: npm run ci:all

      - name: Verify Cloudflare authentication
        run: npx wrangler whoami

      - name: Lint
        run: npm --prefix frontend run lint

      - name: Type-check
        run: npm run typecheck

      - name: Build frontend and Worker
        run: npm run build

      - name: Apply pending D1 migrations
        if: github.event_name == 'push' || inputs.apply_migrations
        run: npm run db:migrate:remote

      # Supporting APIs go first so the newly built browser client never points
      # at an endpoint that has not been deployed yet.
      - name: Deploy FruitFirm ingestion Worker
        run: npm run deploy:fruitfirm

      - name: Deploy public DeepFlavor API Worker
        run: npm run deploy:deepflavor

      - name: Deploy application Worker
        run: npx wrangler deploy --config frontend/dist/blueberry_web/wrangler.json

      - name: Smoke-test production
        run: |
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://blueberry-web.com/deepflavor)" = "200"
          test "$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 20 https://deepflavor-api.blueberry-web.com/)" = "404"
